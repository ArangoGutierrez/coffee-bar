#
# WHY THIS IS AN ISSUE FORM AND NOT A PLAIN MARKDOWN FILE.
# GitHub surfaces `.github/pull_request_template.md` and `.github/ISSUE_TEMPLATE/`.
# It surfaces nothing else. A checklist at `.github/release_template.md` gets
# opened only by someone who already remembered to open it, and remembering is
# the step that failed. An issue stays in the issue list until its boxes are
# ticked.
#
# WHY THE STEPS LIVE IN `textarea` DEFAULTS AND NOT IN `markdown` BLOCKS.
# A `markdown` element is display-only: it renders while the form is filled and
# does NOT appear in the created issue. A `textarea` `value:` default DOES, and
# GitHub renders a `- [ ]` list in an issue body as tickable checkboxes. Every
# step that must survive submission is therefore a textarea default.
#
# WHAT THIS FILE IS FOR. v0.1.1 pushed a tag, then stopped: no release object,
# the tap left on v0.1.0, and the site still advertising the older version. Each
# phase below ends with the check that would have caught that.

name: Release checklist
description: Cut a release without forgetting the release object, the tap, or the site.
title: "Release v"
labels: ["release"]

body:
  - type: markdown
    attributes:
      value: |
        One issue per release. Open it BEFORE the tag exists, and tick as you go.

        **Every outward step needs explicit approval for that specific action.**
        Approval for one step never carries to the next, and approving a step
        NUMBER is not approving the action.

        Replace `X.Y.Z` with the version and `PREV` with the previous one
        throughout. The steps are prefilled — edit them only when this release
        genuinely differs.

  - type: input
    id: version
    attributes:
      label: Version
      description: The version being cut, without the leading v.
      placeholder: 0.1.2
    validations:
      required: true

  - type: input
    id: previous
    attributes:
      label: Previous version
      description: The version this one follows. Used for the code-delta check.
      placeholder: 0.1.1
    validations:
      required: true

  - type: dropdown
    id: code_delta
    attributes:
      label: Does this release change code?
      description: >-
        Answer from the delta command in phase 1, not from memory. When it is
        "no", the release notes must say so plainly, so nobody reads the version
        bump as a bugfix.
      options:
        - "Yes — Sources/, Package.swift or Tests/ changed"
        - "No — the code is identical to the previous tag"
        - "Not checked yet"
    validations:
      required: true

  - type: textarea
    id: phase1
    attributes:
      label: Phase 1 — preconditions
      value: |
        RESUMING A HALF-CUT RELEASE? Establish where you actually are before
        ticking anything. These four answer it, and none of them changes state:

        ```
        git ls-remote --tags origin | grep vX.Y.Z                      # tag pushed?
        gh api repos/ArangoGutierrez/coffee-bar/releases \
          --jq '[.[] | select(.draft==false)] | length'   # PUBLISHED release exists?
        grep 'tags/v' "$(brew --repository ArangoGutierrez/coffee-bar)/Formula/coffee-bar.rb"
        curl -sS https://arangogutierrez.github.io/coffee-bar/ | grep -o '0\.[0-9]*\.[0-9]*'
        ```

        The third line reads the tap through `brew --repository`, which resolves
        the checkout by name. Never write the absolute path to a local clone into
        this issue: `noTrackedFileCarriesLiveSessionProse` fails the suite on the
        maintainer's username, and a release issue is public.

        - [ ] `main` is clean and pushed — `git status -sb` shows no divergence.
        - [ ] The suite is green against the FINAL commit, not an earlier one.
              Check the exit code, and check the suite count against THIS tree:
              ```
              swift test; echo "rc=$?"                    # expect: rc=0
              grep -rhoE '^@Suite' Tests --include='*.swift' | wc -l
              ```
              The second command counts the suites the tree declares now, and
              the `Test run with N tests in M suites passed` line must report the
              same M. Do NOT compare against a count written into this template.
              An earlier draft expected 4 suites; #14 took the tree to 11 and the
              expectation was stale for every release after it.
        - [ ] The tree compiles from a CLEAN scratch path. Report this
              separately from the run above — it is a different claim:
              ```
              swift build --scratch-path "/tmp/cb-clean-$(date +%s)-$$" --build-tests
              ```
              A warm `.build` hid five compile errors during v0.2 while a review
              certified the tree green six times over. The scratch path carries a
              timestamp and a PID on purpose: a fixed name lets an earlier run's
              artifacts be picked up silently, which is the warm-cache failure
              again under a different directory.
        - [ ] Record the code delta against the previous tag:
              ```
              git diff --name-status vPREV..HEAD -- Sources Package.swift Package.resolved Tests
              ```
              Empty output means this release ships no code change. Say so in the
              notes and set the dropdown above accordingly.
        - [ ] The version is unused. **Applies only before the tag exists** — on a
              resumed release the tag is supposed to be there, and this check
              inverts. Both must come back empty on a fresh cut:
              ```
              git tag -l vX.Y.Z
              git ls-remote --tags origin | grep vX.Y.Z
              ```

  - type: textarea
    id: phase2
    attributes:
      label: Phase 2 — build, sign, notarise
      value: |
        - [ ] Build the app. Before the tag exists, `git describe` cannot supply
              the version, so pass it explicitly:
              ```
              COFFEE_BAR_VERSION=X.Y.Z scripts/build-app.sh
              ```
        - [ ] Record the architectures. **Do not assume universal** — v0.1.1
              shipped `arm64` only, and the notes had to say so:
              ```
              lipo -archs build/CoffeeBar.app/Contents/MacOS/coffee-bar
              ```
        - [ ] Sign the app, notarise it, and staple it.
        - [ ] **WARNING: staple the APP before the DMG is rebuilt around it.** A
              DMG notarised on its own leaves the dragged-out app dependent on an
              online check.
        - [ ] Rebuild the DMG around the stapled app, then notarise and staple
              the DMG.
        - [ ] `notarytool submit --wait` outlives the 10-minute command cap. Run
              it in the background; history is authoritative:
              ```
              xcrun notarytool history --keychain-profile coffeebar-app
              ```
        - [ ] Verify the app INSIDE the mounted DMG. `build/CoffeeBar.app` is not
              the artifact that ships. The mountpoint carries the version so a
              stale mount from an earlier run cannot be read by mistake:
              ```
              hdiutil attach build/dist/coffee-bar-X.Y.Z.dmg -readonly -nobrowse -mountpoint /tmp/cbverify-X.Y.Z
              /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/cbverify-X.Y.Z/CoffeeBar.app/Contents/Info.plist
              codesign -dvv /tmp/cbverify-X.Y.Z/CoffeeBar.app
              spctl --assess --type execute -vv /tmp/cbverify-X.Y.Z/CoffeeBar.app
              xcrun stapler validate /tmp/cbverify-X.Y.Z/CoffeeBar.app
              cmp LICENSE /tmp/cbverify-X.Y.Z/CoffeeBar.app/Contents/Resources/LICENSE && echo "licence matches"
              /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" /tmp/cbverify-X.Y.Z/CoffeeBar.app/Contents/Info.plist
              hdiutil detach /tmp/cbverify-X.Y.Z
              ```
              Expect the stamp `X.Y.Z`, `Developer ID Application`, `accepted`,
              `source=Notarized Developer ID`, then `licence matches` and the
              copyright string.

              WARNING. The two licence lines must stay ABOVE `hdiutil detach`.
              They read a path inside the mountpoint, so after the detach they
              fail on a path that no longer exists. A first draft of this step
              sat below the detach and would have failed every time.

              Apache-2.0 section 4(a) requires giving every recipient a copy of
              the Licence, and the artifact that must carry it is the one that
              ships, not the one in `build/`. Until v0.1.1 the DMG carried no
              licence at all. `build-app.sh` now copies it and aborts if the copy
              fails, but nothing checked the SHIPPED artifact, so the fix could
              regress here unnoticed. `cmp` and not `test -f`: a truncated or
              wrong-licence file passes an existence check and complies with
              nothing.
        - [ ] Record the digest for the notes:
              ```
              shasum -a 256 build/dist/coffee-bar-X.Y.Z.dmg
              ```

  # The release notes live HERE, not in a scratch file. v0.1.1's notes sat in
  # /tmp between drafting and publishing, where a reboot would have destroyed
  # them and they would have been rewritten from memory. Drafting them in the
  # issue makes them durable, reviewable before the release exists, and diffable
  # in the issue history.
  - type: textarea
    id: notes
    attributes:
      label: Release notes (draft here, then publish from this text)
      description: >-
        Write them before creating the release. Save with
        `gh issue view <N> --json body` and extract this section, or paste into
        `--notes-file`. Do not keep the only copy in a scratch file.
      value: |
        <!-- What changed, and what it means for someone installing it. -->

        ## Install

        <!--
        Download and Homebrew are DIFFERENT artifacts. Say which is signed.
        A source build is ad-hoc signed and Gatekeeper does not accept it.
        -->

        ## Requirements

        - macOS <version> or later.
        - Architectures: <paste `lipo -archs` output — do NOT assume universal>.

        ## Verifying the download

        ```
        shasum -a 256 coffee-bar-X.Y.Z.dmg
        # <paste the digest>
        spctl --assess --type open --context context:primary-signature -vv coffee-bar-X.Y.Z.dmg
        # accepted
        # source=Notarized Developer ID
        ```

  - type: textarea
    id: phase3
    attributes:
      label: Phase 3 — tag and release object
      value: |
        The tap's `livecheck` uses `strategy :github_latest`, which needs a
        Release object. A pushed tag with no release is the worst resting state:
        it is public, and nothing downstream can use it.

        **WARNING — the tag push below turns `main` RED.** The site guard reads
        the newest tag, so the sidebar becomes wrong the moment the tag lands and
        stays wrong until phase 5 merges. Have the phase 5 commit written and
        reviewed BEFORE you tick the push step.

        - [ ] Create the signed, annotated tag:
              ```
              git tag -s vX.Y.Z -m "vX.Y.Z — <summary>"
              git tag -v vX.Y.Z          # expect: Good "git" signature
              ```
        - [ ] **APPROVAL NEEDED** — push the tag:
              ```
              git push origin vX.Y.Z
              ```
        - [ ] The `Release` workflow passed on the tagged commit. It only
              verifies; it creates no release:
              ```
              gh run list --repo ArangoGutierrez/coffee-bar --workflow release.yml --limit 1
              ```
        - [ ] **APPROVAL NEEDED** — create the release as a draft and attach the
              DMG:
              ```
              gh release create vX.Y.Z --repo ArangoGutierrez/coffee-bar --draft --verify-tag \
                --title "vX.Y.Z — <title>" --notes-file <notes> \
                build/dist/coffee-bar-X.Y.Z.dmg
              ```
        - [ ] The notes state the architectures, the digest, and — when the code
              did not change — that the code did not change.
        - [ ] **APPROVAL NEEDED** — publish it:
              ```
              gh release edit vX.Y.Z --repo ArangoGutierrez/coffee-bar --draft=false
              gh api repos/ArangoGutierrez/coffee-bar/releases \
                --jq '[.[] | select(.draft==false)] | length'   # expect: 1 more than before
              ```
              **Filter on `.draft==false`.** A bare `length` counts DRAFTS for
              anyone with write access, so it reads "one more than before" the
              moment phase 3 creates the draft, before a single byte is public.
              Measured on the v0.3.0 cut: 4 published, draft created, bare
              `length` said 5 while an anonymous `/releases/latest` still
              returned the previous version.
              ```
              ```

  - type: textarea
    id: phase4
    attributes:
      label: Phase 4 — the Homebrew tap
      value: |
        Repo: `ArangoGutierrez/homebrew-coffee-bar`. The digest cannot exist
        before the tag, because GitHub generates the tarball from the tag.

        - [ ] Compute the digest from the release tarball. **Download to a FILE
              and check the exit code. Never pipe curl into shasum:**
              ```
              curl -fsSL -o /tmp/cb-X.Y.Z.tar.gz \
                https://github.com/ArangoGutierrez/coffee-bar/archive/refs/tags/vX.Y.Z.tar.gz
              rc=$?; [ $rc -eq 0 ] || { echo "curl failed rc=$rc"; exit 1; }
              file /tmp/cb-X.Y.Z.tar.gz     # must report: gzip compressed data
              shasum -a 256 /tmp/cb-X.Y.Z.tar.gz
              ```
              Two distinct traps, and `-f` only closes the first:
              1. **Without `-f`**, curl writes the 404 HTML page to stdout and you
                 hash an error page.
              2. **With `-f` but piped**, the pipe discards curl's exit code, so
                 `shasum` hashes empty input and prints
                 `e3b0c442...7852b855` — the SHA-256 of the empty string, a
                 well-formed 64-hex value that looks completely legitimate.
                 Measured against a deliberately bad tag URL on 2026-08-04.

              Never hand-type a digest. Never accept one whose source command you
              did not see succeed.
        - [ ] Update `url` and `sha256` in `Formula/coffee-bar.rb`.
        - [ ] The tap's own checks pass:
              ```
              bash tests/verify/t3-head-block.sh Formula/coffee-bar.rb   # expect EXIT=0
              bash tests/verify/t4-app-install.sh Formula/coffee-bar.rb  # expect EXIT=0
              ```
        - [ ] **APPROVAL NEEDED** — commit and push the tap.
        - [ ] A real install works from a clean state:
              ```
              brew update && brew upgrade coffee-bar
              brew list --versions coffee-bar     # expect X.Y.Z
              ```
        - [ ] Note for the notes: a source build is ad-hoc signed
              (`Signature=adhoc`, `TeamIdentifier=not set`) and Gatekeeper does
              not accept it. Only the DMG is the signed path. Do not claim
              otherwise.

  - type: textarea
    id: phase5
    attributes:
      label: Phase 5 — the CHANGELOG and the site
      value: |
        The release must exist BEFORE the page advertises it. A download button
        pointing at a release that is not published is a broken promise.

        **This phase cannot start before phase 3.** The CHANGELOG header states
        the rule plainly: a version heading there means a tag exists. So the
        order is not a preference, it is the file's own contract.

        **WARNING — the tag opens a RED WINDOW on `main`.**
        `everyPageShowsTheNewestReleasedVersion` compares every page's
        `<p class="sidebar-version">` against `git tag --sort=-v:refname`. The
        sidebar may therefore name `vX.Y.Z` only after the tag exists, and until
        this phase merges the suite FAILS on `main`. Prepare the whole commit —
        both changelog files, the sidebar version and the download link — BEFORE
        the tag is pushed in phase 3.

        **`main` is protected, so you cannot push this commit to it.** The rules
        on `refs/heads/main` require a pull request and the `build-test` check.
        "Merge" here means: push a branch, open a PR, wait for the FULL check
        rollup, then merge. The window is as long as CI takes, not seconds.

        **Better, and what the v0.3.0 cut actually did.** Create the signed tag
        LOCALLY and do not push it. `newestReleaseTag()` reads `git tag`, so a
        local tag alone turns the site guards red, and this commit can be driven
        GREEN on a branch while nothing is public. Push the tag only once that
        branch is green. `main` then never sees a red run at all, because CI runs
        on push and the next push to `main` is the one carrying the fix.

        **WARNING — `CHANGELOG.md` and `site/changelog.html` move in ONE commit.**
        `everyReleaseInTheChangelogIsOnTheChangelogPage` compares the release
        count in BOTH directions, so a version heading added to one file alone
        turns the suite RED. The guard keys on the version AND the date, so the
        two dates must be identical. The pair for 0.1.1 is exactly:
        ```
        CHANGELOG.md          ## [0.1.1] — 2026-08-04
        site/changelog.html   <h2>0.1.1 — 2026-08-04</h2>
        ```

        - [ ] Add the release to `CHANGELOG.md` AND to `site/changelog.html` in
              the same commit, carrying the same date on both sides.
        - [ ] Update `<p class="sidebar-version">` to `vX.Y.Z` on EVERY page, not
              just the one you were looking at. `everyPageCarriesTheSameSidebar`
              requires the sidebar to be byte-identical everywhere, so a partial
              edit fails that guard as well as the version guard above.
        - [ ] Update or add the DMG download link.
        - [ ] **Run the suite by hand before merging the site change.**
              `.github/workflows/pages.yml` checks only that `site/index.html` is
              non-empty and that the `DO NOT PUBLISH THIS SECTION` marker is
              absent. It never runs `swift test`, so `DocsClaims_test.swift` —
              the guard that reads the page — does not gate the publish. That is
              how a leaked username reached the live site.
              ```
              swift test
              ```
        - [ ] After the deploy, check the LIVE page, not the local file:
              ```
              curl -sS https://arangogutierrez.github.io/coffee-bar/ > /tmp/cb-live-X.Y.Z.html
              grep -c 'X\.Y\.Z' /tmp/cb-live-X.Y.Z.html            # expect: nonzero
              grep -ci "$(id -un)" /tmp/cb-live-X.Y.Z.html         # expect: 0
              ```
              The second grep re-checks the DEPLOYED bytes for the maintainer's
              work username, which the landing page once published inside an HTML
              comment. It reads the name from `id -un` rather than spelling it
              out: `noTrackedFileCarriesLiveSessionProse` scans every tracked file
              for that literal and fails the suite, so writing it here would break
              the build. That guard covers the repository; this line covers what
              is actually served.

  - type: textarea
    id: phase6
    attributes:
      label: Phase 6 — close out and final coherence check
      value: |
        - [ ] Close any issue this release resolves, and any issue it made stale.
        - [ ] Update `docs/ROADMAP.md` if the release changed a decision.
        - [ ] **Version coherence — all four must agree.** This is the check that
              v0.1.1 failed: the tag said one thing, the tap and the site said
              another.
              ```
              git describe --tags --abbrev=0                                  # vX.Y.Z
              # DMG stamp, from the mounted image in phase 2                   # X.Y.Z
              grep 'tags/v' "$(brew --repository ArangoGutierrez/coffee-bar)/Formula/coffee-bar.rb"
              curl -sS https://arangogutierrez.github.io/coffee-bar/ | grep -o 'X\.Y\.Z'
              ```
              The tap line expects `tags/vX.Y.Z.tar.gz`. It reads the checkout
              that `brew` resolves, so run it AFTER the `brew update` in phase 4
              or it reports the version brew last fetched.
        - [ ] The release object exists and carries the DMG:
              ```
              gh release view vX.Y.Z --repo ArangoGutierrez/coffee-bar --json assets,isDraft \
                --jq '{draft: .isDraft, assets: [.assets[].name]}'
              ```
              Expect `draft: false` and the DMG in the asset list.

  # NOT `required: true`. A required checkbox must be ticked to SUBMIT the form,
  # which makes it an entry gate. Release issue #20 opened with all four already
  # ticked, so it asserted "every claim above was pasted from a command run
  # against the final state" at a moment when nothing had been run yet. These are
  # exit conditions: they submit unticked and get ticked when they become true.
  - type: checkboxes
    id: invariants
    attributes:
      label: Before you close this issue
      description: >-
        Tick these at the END, when each one is true. They arrive unticked on
        purpose.
      options:
        - label: >-
            Every outward action above got its own explicit approval. Approving a
            step number is not approving the action.
        - label: >-
            No signing key, keychain password, API key or private path appears in
            this issue.
        - label: >-
            The release notes state the architectures the binary actually
            carries, taken from `lipo -archs` and not assumed.
        - label: >-
            Every claim above was pasted from a command run against the final
            state. A remembered number is not evidence.
