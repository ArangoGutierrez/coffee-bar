name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back; read-only is all the build needs.
permissions:
  contents: read

concurrency:
  # Per branch/PR. A new push supersedes the run it obsoletes rather than
  # queueing a second macOS runner behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    # macOS runners bill at 10x; a hung build must not reach the 6-hour default.
    timeout-minutes: 30
    steps:
      # Pinned by commit SHA: a tag like @v4 is mutable and can be repointed
      # at arbitrary code by anyone who can push to the action's repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # TAGS ARE REQUIRED, and the default checkout does not fetch them.
          #
          # `SiteClaims_test.swift` asserts the version shown on every page, and
          # the version inside the DMG download URL, against `git tag`. With the
          # default `fetch-depth: 1` the runner has zero tags, so that guard
          # reported "cannot read the newest tag; this guard cannot run and will
          # not pretend it passed" and failed the suite — correctly. It is written
          # to fail loudly rather than skip, because a guard that silently skips
          # is worse than no guard.
          #
          # `fetch-tags` rather than `fetch-depth: 0`: the guard needs the tag
          # NAMES, not the history, so this keeps the checkout shallow.
          fetch-tags: true

      - name: Show toolchain
        run: swift --version

      # Fail here, with a clear message, rather than inside a test. If the tags
      # ever stop arriving, the version guard's failure text points at the page
      # rather than at the checkout, which sends the reader to the wrong file.
      - name: Confirm the tags arrived
        run: |
          git tag --sort=-v:refname | head -3
          test -n "$(git tag)" || { echo "no tags in the checkout; SiteClaims version guards cannot run"; exit 1; }

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      # Nothing ran `scripts/build-app.sh` outside a release until now, so the
      # bundle-assembly path could break on `main` and stay broken until someone
      # cut a DMG. It needs `swift build -c release` (the step above) and
      # `iconutil`, which ships with the Command Line Tools — the script uses it
      # rather than `actool` precisely so no full Xcode is required. One step in
      # a job that already pays for this runner: a second `macos-15` job would
      # double the 10x bill for one script invocation.
      #
      # COFFEE_BAR_VERSION is pinned rather than left to the script's own
      # `git describe` fallback. A tag-fetch regression then fails at "Confirm
      # the tags arrived" above, which names the checkout, instead of surfacing
      # here as a confusing version string. Note the asymmetry: `build-app.sh`
      # reads COFFEE_BAR_VERSION, `release-dmg.sh` reads VERSION.
      #
      # The assertions are the point of the step. `cp`, `install` and `iconutil`
      # all return 0 while producing nothing useful, and this repository has
      # been bitten by that more than once, so this asks what the directory
      # HOLDS rather than whether the script exited 0. No pipe carries a status
      # here: `script | tail && next` would swallow the failure.
      - name: Build the app bundle
        env:
          COFFEE_BAR_VERSION: 0.0.0-ci
        run: |
          scripts/build-app.sh
          app="build/CoffeeBar.app"
          test -d "${app}" || { echo "no bundle at ${app}"; exit 1; }
          test -x "${app}/Contents/MacOS/coffee-bar" \
            || { echo "${app}/Contents/MacOS/coffee-bar is missing or not executable"; exit 1; }
          got="$(plutil -extract CFBundleShortVersionString raw -o - "${app}/Contents/Info.plist")"
          [ "${got}" = "${COFFEE_BAR_VERSION}" ] \
            || { echo "CFBundleShortVersionString is '${got}', expected '${COFFEE_BAR_VERSION}'"; exit 1; }
          echo "bundle ok: ${app} reports ${got}"

      # CI MUST NOT SIGN, and this is the step that proves it did not.
      #
      # The step above builds the bundle and asks what it CONTAINS. This one
      # asks what it IS. `#71a` made signing opt-in after an auto-detecting
      # `sign-bundle.sh` made `brew install coffee-bar` run `codesign --sign
      # <the installing user's private key>` over a bundle they were merely
      # installing. That fix lives in a script, and until now nothing read the
      # result back off a bundle CI actually produced — so a regression would
      # travel the Homebrew path (`build-app.sh` IS the formula's build path)
      # with every check on this workflow still green.
      #
      # READ OFF THE ARTIFACT, never inferred from an exit code. `build-app.sh`
      # exits 0 whether it signed or not — that is precisely what opt-in means —
      # and its closing line prints "unsigned" from a variable it sets itself,
      # so believing that line would be believing the thing under test.
      #
      # `codesign -d` writes its report to STDERR, so the MERGED stream is what
      # gets captured. Reading stdout alone returns the empty string and every
      # assertion below would pass vacuously.
      #
      # Captured ONCE into a variable and matched with a herestring, never
      # `codesign … | grep -q`. `grep -q` exits at the first match, `codesign`
      # then dies of SIGPIPE at status 141, and the pipeline reports failure for
      # a bundle that was perfectly correct. `sign-bundle.sh` carries the same
      # measurement, from the same bite.
      #
      # Measured 2026-08-15 on a cold worktree with COFFEE_BAR_VERSION=0.0.0-ci
      # and no SIGN_IDENTITY — the exact environment of the step above:
      #   Signature=adhoc
      #   TeamIdentifier=not set
      #   flags=0x20002(adhoc,linker-signed)
      # `docs/BUILDING.md` documents that triple, and `SECURITY.md` publishes
      # the middle line as a promise to everyone who installs from Homebrew.
      #
      # THREE assertions, each red for a different regression:
      #   adhoc       the linker signature is still there at all. A build that
      #               emitted an unsigned Mach-O reports "not signed at all".
      #   no team     nothing signed this with a Developer ID. This is the
      #               literal sentence SECURITY.md publishes.
      #   no runtime  nobody ran `codesign --sign` here, ad hoc or otherwise.
      #               The hardened-runtime flag is the discriminator
      #               `BundleSigning_test.swift` settled on: the linker never
      #               sets it and every deliberate signature in this repository
      #               passes `--options runtime`. It is the ONLY one of the
      #               three that catches `SIGN_IDENTITY: '-'` being added to
      #               this workflow, because an ad-hoc `codesign` run leaves
      #               both lines above reading exactly as they do now.
      #
      # The flags check asserts the line EXISTS before asserting what it lacks.
      # A bare "does not contain runtime" is green when the whole report is
      # empty, which is the vacuous-absence trap `scripts/verify/t2-panel-version.sh`
      # records: assert presence positively, then discriminate.
      #
      # `|| true` ON THE CAPTURE, and it is not sloppiness. `codesign -d` exits
      # NON-ZERO for a bundle carrying no signature — exactly the regression the
      # first assertion exists to catch — and `report="$(…)"` takes the exit
      # status of the substitution, so under the `bash -e` GitHub wraps `run:`
      # in, the shell died at this line. Measured 2026-08-15 against a bundle
      # stripped with `codesign --remove-signature`: the step exited 1 having
      # printed NOTHING, because the explanation was sitting captured in
      # `${report}` and the `echo` below it never ran. Red for the right reason
      # and unreadable is still a bad guard.
      #
      # EVERY assertion runs, and the failures are COLLECTED rather than exiting
      # at the first. Measured on the same date with a stand-in `codesign` on
      # PATH reporting a Developer ID: exiting early meant `Signature=adhoc`
      # fired and the TeamIdentifier assertion — the one that guards the
      # sentence SECURITY.md actually publishes — never executed at all. An
      # assertion that cannot be observed failing is one nobody can trust, so
      # this collects and reports all of them.
      - name: Confirm CI did not sign the bundle
        run: |
          app="build/CoffeeBar.app"
          report="$(codesign -dv --verbose=4 "${app}" 2>&1 || true)"
          echo "${report}"

          fail=0
          note() { echo "FAIL: $*"; fail=1; }

          grep -q '^Signature=adhoc$' <<<"${report}" \
            || note "${app} is not ad-hoc signed; SECURITY.md promises Signature=adhoc"

          grep -q '^TeamIdentifier=not set$' <<<"${report}" \
            || note "${app} does not report TeamIdentifier=not set; a bundle CI built must name no team"

          flags="$(grep -o 'flags=0x[0-9a-f]*([^)]*)' <<<"${report}" | head -1)"
          case "${flags}" in
            "")        note "no CodeDirectory flags line in the codesign report; this check cannot run and will not pretend it passed" ;;
            *runtime*) note "${flags} carries the hardened runtime, so something ran codesign --sign; CI must not sign" ;;
          esac

          [ "${fail}" -eq 0 ] || exit 1
          echo "signature ok: ad-hoc, no team, ${flags}"

  # A SEPARATE job, on ubuntu, deliberately. The policy bench and the art guards
  # are pure logic with no macOS dependency, and the comment above records that
  # macOS runners bill at 10x. This runs at 1x and in parallel with the Swift
  # build.
  #
  # THE CHECK NAME OF THIS JOB CHANGED. GitHub Actions names a check run after
  # the job's `name:` when one is set, and falls back to the job id only when it
  # is absent. This job HAS a `name:`, so its check went from "Policy bench unit
  # tests" to "Policy bench and art guards" — keeping the `bench-test` id did not
  # hold the name still.
  #
  # No configured gate breaks, but for a different reason: the required check is
  # `build-test`, which carries no `name:` and so is named by its id. A rule that
  # ever names THIS job must be renamed with it.
  bench-test:
    name: Policy bench and art guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's preinstalled Node is deliberate. `node:test` is built in, so
      # this needs no package.json, no dependency and no third-party setup action
      # — one fewer pinned supply-chain surface in a repository that pins every
      # `uses:` by SHA for exactly that reason.
      #
      # The version is ASSERTED rather than assumed: site/assets/bench.test.js
      # uses `import.meta.dirname`, which lands in Node 20.11. A runner downgrade
      # must fail loudly here instead of skipping the suite silently.
      - name: Require Node 20.11 or later
        run: |
          node --version
          node -e 'const [a,b] = process.versions.node.split(".").map(Number); if (a < 20 || (a === 20 && b < 11)) { console.error("import.meta.dirname needs Node >= 20.11"); process.exit(1); }'

      # NAMED EXPLICITLY. Never a directory, never a glob. Measured 2026-08-04 on
      # Node 26, and the same three lines sit in the test file's own header:
      #   node --test site/assets/              -> rc=1, "Cannot find module". Broken.
      #   node --test 'site/assets/*.test.js'   -> rc=0 when NOTHING matches. Vacuous.
      #   node --test site/assets/bench.test.js -> rc=1 when the file is absent.
      # Only the explicit path fails closed, so a rename cannot silently disable
      # this check while the job stays green.
      - name: Bench module tests
        run: node --test site/assets/bench.test.js

      # Pillow comes from apt, not from pip. Two reasons, in this order:
      #   1. `pip install` into the runner's system Python is refused on
      #      ubuntu-24.04 — PEP 668 marks it externally-managed.
      #   2. An unpinned PyPI name is a supply-chain surface in a workflow that
      #      pins every `uses:` by commit SHA for exactly that reason. apt takes
      #      the package from the runner image's own distribution.
      # `python3-pil` provides `PIL.Image`, which is all three scripts import.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      # ASSERTED, not assumed, and the same shape as the Node version check
      # above. If `python3` on PATH is ever not the interpreter apt installed
      # into, this fails HERE naming the interpreter, instead of failing inside
      # census.py with an ImportError that reads like a broken guard.
      #
      # `PIL.Image`, never bare `PIL`. `PIL/__init__.py` defines `__version__`
      # WITHOUT importing `Image`, so `import PIL` succeeds on a namespace
      # package or a half-unpacked install — exactly the partial install this
      # step exists to catch. All four scripts do `from PIL import Image`, so
      # the probe has to reach the same depth they do.
      - name: Confirm Pillow is importable
        run: python3 -c 'import sys, PIL.Image; print(PIL.__version__, sys.executable)'

      # census.py globs `assets/art/**/*.png` RELATIVE to the working directory,
      # which is the repository root here. It asserts the file COUNT as well as
      # the pixels, so a path that stops resolving fails loudly rather than
      # reporting a clean sweep of nothing.
      - name: Art census
        run: python3 assets/art/census.py

      # Three separate steps, never one script and never a directory. Each names
      # the file it runs, so a failure points at one guard. The two _test.py
      # files build their own PNG trees under a temp directory and resolve their
      # subject relative to their own __file__, so they need no working
      # directory of their own.
      - name: Census guard tests
        run: python3 assets/art/census_test.py

      - name: Remap guard tests
        run: python3 assets/art/remap_test.py
