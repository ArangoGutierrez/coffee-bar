name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back; read-only is all the build needs.
permissions:
  contents: read

concurrency:
  # Per branch/PR. A new push supersedes the run it obsoletes rather than
  # queueing a second macOS runner behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    # macOS runners bill at 10x; a hung build must not reach the 6-hour default.
    timeout-minutes: 30
    steps:
      # Pinned by commit SHA: a tag like @v4 is mutable and can be repointed
      # at arbitrary code by anyone who can push to the action's repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # TAGS ARE REQUIRED, and the default checkout does not fetch them.
          #
          # `SiteClaims_test.swift` asserts the version shown on every page, and
          # the version inside the DMG download URL, against `git tag`. With the
          # default `fetch-depth: 1` the runner has zero tags, so that guard
          # reported "cannot read the newest tag; this guard cannot run and will
          # not pretend it passed" and failed the suite — correctly. It is written
          # to fail loudly rather than skip, because a guard that silently skips
          # is worse than no guard.
          #
          # `fetch-tags` rather than `fetch-depth: 0`: the guard needs the tag
          # NAMES, not the history, so this keeps the checkout shallow.
          fetch-tags: true

      - name: Show toolchain
        run: swift --version

      # Fail here, with a clear message, rather than inside a test. If the tags
      # ever stop arriving, the version guard's failure text points at the page
      # rather than at the checkout, which sends the reader to the wrong file.
      - name: Confirm the tags arrived
        run: |
          git tag --sort=-v:refname | head -3
          test -n "$(git tag)" || { echo "no tags in the checkout; SiteClaims version guards cannot run"; exit 1; }

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  # A SEPARATE job, on ubuntu, deliberately. The policy bench and the art guards
  # are pure logic with no macOS dependency, and the comment above records that
  # macOS runners bill at 10x. This runs at 1x and in parallel with the Swift
  # build.
  #
  # THE CHECK NAME OF THIS JOB CHANGED. GitHub Actions names a check run after
  # the job's `name:` when one is set, and falls back to the job id only when it
  # is absent. This job HAS a `name:`, so its check went from "Policy bench unit
  # tests" to "Policy bench and art guards" — keeping the `bench-test` id did not
  # hold the name still.
  #
  # No configured gate breaks, but for a different reason: the required check is
  # `build-test`, which carries no `name:` and so is named by its id. A rule that
  # ever names THIS job must be renamed with it.
  bench-test:
    name: Policy bench and art guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's preinstalled Node is deliberate. `node:test` is built in, so
      # this needs no package.json, no dependency and no third-party setup action
      # — one fewer pinned supply-chain surface in a repository that pins every
      # `uses:` by SHA for exactly that reason.
      #
      # The version is ASSERTED rather than assumed: site/assets/bench.test.js
      # uses `import.meta.dirname`, which lands in Node 20.11. A runner downgrade
      # must fail loudly here instead of skipping the suite silently.
      - name: Require Node 20.11 or later
        run: |
          node --version
          node -e 'const [a,b] = process.versions.node.split(".").map(Number); if (a < 20 || (a === 20 && b < 11)) { console.error("import.meta.dirname needs Node >= 20.11"); process.exit(1); }'

      # NAMED EXPLICITLY. Never a directory, never a glob. Measured 2026-08-04 on
      # Node 26, and the same three lines sit in the test file's own header:
      #   node --test site/assets/              -> rc=1, "Cannot find module". Broken.
      #   node --test 'site/assets/*.test.js'   -> rc=0 when NOTHING matches. Vacuous.
      #   node --test site/assets/bench.test.js -> rc=1 when the file is absent.
      # Only the explicit path fails closed, so a rename cannot silently disable
      # this check while the job stays green.
      - name: Bench module tests
        run: node --test site/assets/bench.test.js

      # Pillow comes from apt, not from pip. Two reasons, in this order:
      #   1. `pip install` into the runner's system Python is refused on
      #      ubuntu-24.04 — PEP 668 marks it externally-managed.
      #   2. An unpinned PyPI name is a supply-chain surface in a workflow that
      #      pins every `uses:` by commit SHA for exactly that reason. apt takes
      #      the package from the runner image's own distribution.
      # `python3-pil` provides `PIL.Image`, which is all three scripts import.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      # ASSERTED, not assumed, and the same shape as the Node version check
      # above. If `python3` on PATH is ever not the interpreter apt installed
      # into, this fails HERE naming the interpreter, instead of failing inside
      # census.py with an ImportError that reads like a broken guard.
      #
      # `PIL.Image`, never bare `PIL`. `PIL/__init__.py` defines `__version__`
      # WITHOUT importing `Image`, so `import PIL` succeeds on a namespace
      # package or a half-unpacked install — exactly the partial install this
      # step exists to catch. All four scripts do `from PIL import Image`, so
      # the probe has to reach the same depth they do.
      - name: Confirm Pillow is importable
        run: python3 -c 'import sys, PIL.Image; print(PIL.__version__, sys.executable)'

      # census.py globs `assets/art/**/*.png` RELATIVE to the working directory,
      # which is the repository root here. It asserts the file COUNT as well as
      # the pixels, so a path that stops resolving fails loudly rather than
      # reporting a clean sweep of nothing.
      - name: Art census
        run: python3 assets/art/census.py

      # Three separate steps, never one script and never a directory. Each names
      # the file it runs, so a failure points at one guard. The two _test.py
      # files build their own PNG trees under a temp directory and resolve their
      # subject relative to their own __file__, so they need no working
      # directory of their own.
      - name: Census guard tests
        run: python3 assets/art/census_test.py

      - name: Remap guard tests
        run: python3 assets/art/remap_test.py
