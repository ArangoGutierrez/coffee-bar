name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back; read-only is all the build needs.
permissions:
  contents: read

concurrency:
  # Per branch/PR. A new push supersedes the run it obsoletes rather than
  # queueing a second macOS runner behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    # macOS runners bill at 10x; a hung build must not reach the 6-hour default.
    timeout-minutes: 30
    steps:
      # Pinned by commit SHA: a tag like @v4 is mutable and can be repointed
      # at arbitrary code by anyone who can push to the action's repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
