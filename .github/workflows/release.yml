name: Release

on:
  push:
    tags: ["v*"]

# Deny by default; each job opts in to the narrowest scope it needs. No job here
# holds a write token, and nothing in this workflow pushes to a branch. The
# Homebrew formula is pinned by hand in the `ArangoGutierrez/homebrew-coffee-bar`
# tap repo, because `brew tap user/repo` resolves to `github.com/user/homebrew-repo`
# and a `Formula/` directory in this repo is therefore not tappable. See
# `docs/ROADMAP.md`, "The release job and `main`".
permissions: {}

concurrency:
  # Scoped to the tag ref, which is immutable. The only run this can cancel is
  # a duplicate of the same tag — never a different release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify the tagged commit
    runs-on: macos-15
    # macOS runners bill at 10x. A hung Swift build must not run to the
    # 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job compiles and runs third-party-reachable code. It has no
          # reason to hold a push token.
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build release binary
        run: swift build -c release --product coffee-bar-probe

      - name: Verify the probe emits a usable report
        run: |
          set -euo pipefail
          .build/release/coffee-bar-probe --json > probe.json
          # `jq -e` exits non-zero when the filter yields false or null, so
          # each check below fails the step on its own.
          jq -e '.schemaVersion == 1' probe.json > /dev/null
          jq -e '[.spikes[].id]
                 | contains(["baseline","S1","S2","S3","S5","S8"])' \
                probe.json > /dev/null
          jq -e '.host.osBuild | length > 0' probe.json > /dev/null
          echo "probe report verified"
